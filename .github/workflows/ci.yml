name: Clinical calculator tests and packaging
on:
  push:
    branches: [ master, main, "audit/**" ]
  pull_request:
    branches: [ master, main ]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install project and test dependencies
        run: python -m pip install --upgrade pip && python -m pip install -e ".[web,dev]" build
      - name: Compile Python modules
        run: python -m compileall -q agents pf_ratio_ards.py cli.py enrichment.py simulator.py
      - name: Run test suite
        run: python -m pytest -q
      - name: Verify CLI entry point
        run: pf-ratio-ards pf --pao2 100 --fio2 0.5
      - name: Build installable package
        run: python -m build
      - name: JavaScript syntax and regression tests
        run: |
          node --check web/app.mjs
          node --test web/calculator.test.mjs
